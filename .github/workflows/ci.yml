# Сборка прошивки: ядро и библиотеки зафиксированы на версиях локальной сборки
# (см. README, раздел «Зависимости»). Расхождение версий = невоспроизводимая сборка.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sudo BINDIR=/usr/local/bin sh
          arduino-cli core update-index

      - name: Install core and libraries (pinned versions)
        run: |
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install \
            "RFID_MFRC522v2@2.0.6" \
            "Settings@1.3.17" \
            "GyverDB@1.4.4" \
            "TimerMs@1.2" \
            "Adafruit NeoPixel@1.15.5" \
            "ArduinoJson@7.4.2"

      - name: Compile (custom OTA partitions)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=no_ota,CDCOnBoot=cdc \
            --build-property "build.partitions=custom" \
            --build-property "upload.maximum_size=1638400" \
            src/esp32_spoolman
